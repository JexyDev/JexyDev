<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <style>
      .text-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .text-sans { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
      @keyframes gridFade { 0%,100%{opacity:.08} 50%{opacity:.18} }
      @keyframes statusPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
      @keyframes onlinePulse { 0%,100%{opacity:1;filter:drop-shadow(0 0 4px #10B981)} 50%{opacity:.6;filter:drop-shadow(0 0 8px #10B981)} }
      @keyframes scanline { 0%{transform:translateY(-60px)} 100%{transform:translateY(340px)} }
      @keyframes titleReveal { 0%{opacity:0;transform:translateX(-16px)} 100%{opacity:1;transform:translateX(0)} }
      @keyframes fadeIn { 0%{opacity:0} 100%{opacity:1} }
      @keyframes bracketDraw { 0%{stroke-dashoffset:60} 100%{stroke-dashoffset:0} }
      @keyframes floatA { 0%,100%{transform:translateY(0);opacity:.6} 50%{transform:translateY(-10px);opacity:1} }
      @keyframes floatB { 0%,100%{transform:translateY(0);opacity:.35} 50%{transform:translateY(-7px);opacity:.7} }
      .grid-h { animation:gridFade 4s ease-in-out infinite; }
      .grid-v { animation:gridFade 4s ease-in-out infinite 2s; }
      .s-dot { animation:statusPulse 2s ease-in-out infinite; }
      .s-dot-b { animation:statusPulse 2s ease-in-out infinite .5s; }
      .s-dot-c { animation:statusPulse 2s ease-in-out infinite 1s; }
      .s-dot-d { animation:statusPulse 2s ease-in-out infinite 1.5s; }
      .s-dot-e { animation:statusPulse 2s ease-in-out infinite 2s; }
      .online { animation:onlinePulse 2s ease-in-out infinite; }
      .scan { animation:scanline 7s linear infinite; }
      .title-anim { animation:titleReveal 1.1s cubic-bezier(.22,1,.36,1) forwards; }
      .fi1 { animation:fadeIn 1s ease forwards; animation-delay:.5s; opacity:0; }
      .fi2 { animation:fadeIn 1s ease forwards; animation-delay:.9s; opacity:0; }
      .fi3 { animation:fadeIn 1s ease forwards; animation-delay:1.3s; opacity:0; }
      .br { stroke-dasharray:60; animation:bracketDraw .9s ease forwards; animation-delay:.2s; }
      .fp1 { animation:floatA 5s ease-in-out infinite; }
      .fp2 { animation:floatB 7s ease-in-out infinite 1.5s; }
      .mi1 { animation:fadeIn 1.5s ease forwards; animation-delay:.3s; opacity:0; }
      .mi2 { animation:fadeIn 1.5s ease forwards; animation-delay:.7s; opacity:0; }
      .mi3 { animation:fadeIn 1.5s ease forwards; animation-delay:1.1s; opacity:0; }
    </style>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="panG" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip0"><rect width="1200" height="280"/></clipPath>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip0)">
    <!-- BG -->
    <rect width="1200" height="280" fill="url(#bgG)"/>

    <!-- Grid H -->
    <g class="grid-h" stroke="#38BDF8" stroke-width="0.5">
      <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    </g>
    <!-- Grid V -->
    <g class="grid-v" stroke="#38BDF8" stroke-width="0.5">
      <line x1="100" y1="0" x2="100" y2="280"/><line x1="200" y1="0" x2="200" y2="280"/>
      <line x1="300" y1="0" x2="300" y2="280"/><line x1="400" y1="0" x2="400" y2="280"/>
      <line x1="500" y1="0" x2="500" y2="280"/><line x1="600" y1="0" x2="600" y2="280"/>
      <line x1="700" y1="0" x2="700" y2="280"/><line x1="800" y1="0" x2="800" y2="280"/>
      <line x1="900" y1="0" x2="900" y2="280"/><line x1="1000" y1="0" x2="1000" y2="280"/>
      <line x1="1100" y1="0" x2="1100" y2="280"/>
    </g>

    <!-- Scanline -->
    <rect class="scan" x="0" y="0" width="1200" height="60" fill="url(#scanG)"/>

    <!-- Left accent -->
    <rect x="0" y="0" width="4" height="280" fill="url(#cyanG)"/>

    <!-- Top status bar -->
    <rect x="0" y="0" width="1200" height="32" fill="#0F172A" opacity="0.92"/>
    <text x="20" y="21" class="text-mono" font-size="10" fill="#38BDF8" letter-spacing="2">JEXYDEV // COMMAND CENTER</text>
    <text x="400" y="21" class="text-mono" font-size="10" fill="#475569" letter-spacing="1">SYS: AUTONOMOUS_STUDIO_v2.0 · JAKARTA_NODE</text>

    <!-- Online badge -->
    <g class="online" transform="translate(822,8)">
      <rect width="150" height="20" rx="3" fill="#10B981" opacity="0.12"/>
      <rect width="150" height="20" rx="3" fill="none" stroke="#10B981" stroke-width="0.8"/>
      <circle cx="14" cy="10" r="4" fill="#10B981"/>
      <text x="26" y="14.5" class="text-mono" font-size="9.5" fill="#10B981" font-weight="700" letter-spacing="1.5">24/7 AUTONOMOUS ONLINE</text>
    </g>
    <text x="1080" y="21" class="text-mono" font-size="10" fill="#475569">UTC+07:00 · WIB</text>

    <!-- Corner brackets -->
    <g fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="square">
      <path class="br" d="M36,52 L36,43 L50,43"/>
      <path class="br" d="M800,52 L800,43 L786,43"/>
      <path class="br" d="M36,248 L36,257 L50,257"/>
      <path class="br" d="M800,248 L800,257 L786,257"/>
    </g>

    <!-- Handle -->
    <g class="fi1">
      <text x="60" y="78" class="text-mono" font-size="12" fill="#64748B" letter-spacing="2">github.com/</text>
      <text x="168" y="78" class="text-mono" font-size="12" fill="#38BDF8" letter-spacing="4" font-weight="700">JexyDev</text>
    </g>

    <!-- Primary name -->
    <g class="title-anim">
      <text x="58" y="140" class="text-sans" font-size="52" font-weight="900" fill="#F1F5F9" letter-spacing="-2">Jeremy Darrell</text>
      <text x="58" y="193" class="text-sans" font-size="52" font-weight="900" fill="#38BDF8" letter-spacing="-2">Andreas</text>
    </g>

    <!-- Role line -->
    <g class="fi2">
      <rect x="58" y="208" width="200" height="2" fill="url(#cyanG)"/>
      <text x="58" y="232" class="text-sans" font-size="14" fill="#94A3B8" letter-spacing=".5">Fullstack Engineer</text>
      <text x="206" y="232" class="text-sans" font-size="14" fill="#475569"> &amp; </text>
      <text x="230" y="232" class="text-sans" font-size="14" fill="#38BDF8" font-weight="600" letter-spacing=".3">Autonomous AI Systems Architect</text>
    </g>

    <!-- Tags -->
    <g class="fi3">
      <rect x="58" y="248" width="82" height="20" rx="10" fill="#1E3A5F" stroke="#38BDF8" stroke-width=".8"/>
      <text x="68" y="262" class="text-mono" font-size="9" fill="#38BDF8" letter-spacing="1">FULLSTACK</text>
      <rect x="150" y="248" width="68" height="20" rx="10" fill="#064E3B" stroke="#10B981" stroke-width=".8"/>
      <text x="162" y="262" class="text-mono" font-size="9" fill="#10B981" letter-spacing="1">MOBILE</text>
      <rect x="228" y="248" width="52" height="20" rx="10" fill="#1E293B" stroke="#7C3AED" stroke-width=".8"/>
      <text x="239" y="262" class="text-mono" font-size="9" fill="#A78BFA" letter-spacing="1">AI/ML</text>
      <rect x="290" y="248" width="62" height="20" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width=".8"/>
      <text x="301" y="262" class="text-mono" font-size="9" fill="#FCD34D" letter-spacing="1">DEVOPS</text>
      <rect x="362" y="248" width="82" height="20" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width=".8"/>
      <text x="373" y="262" class="text-mono" font-size="9" fill="#F9A8D4" letter-spacing="1">BOGOR · ID</text>
    </g>

    <!-- RIGHT PANEL -->
    <rect x="848" y="38" width="336" height="234" rx="4" fill="url(#panG)" stroke="#1E3A5F" stroke-width="1"/>
    <rect x="848" y="38" width="336" height="34" fill="#162032"/>
    <rect x="848" y="62" width="336" height="10" fill="#162032"/>
    <text x="868" y="58" class="text-mono" font-size="10" fill="#475569" letter-spacing="2">STUDIO STATUS DASHBOARD</text>
    <line x1="868" y1="72" x2="1164" y2="72" stroke="#1E3A5F" stroke-width="1"/>

    <!-- Uptime -->
    <g class="mi1">
      <text x="868" y="92" class="text-mono" font-size="9" fill="#64748B" letter-spacing="1">STUDIO UPTIME</text>
      <text x="868" y="112" class="text-mono" font-size="22" font-weight="700" fill="#38BDF8" filter="url(#glow1)">24 / 7 / 365</text>
      <rect x="868" y="118" width="296" height="2" fill="#1E3A5F"/>
      <rect x="868" y="118" width="260" height="2" fill="#38BDF8" opacity=".5"/>
    </g>

    <!-- Agents -->
    <g class="mi2">
      <text x="868" y="138" class="text-mono" font-size="9" fill="#64748B" letter-spacing="1">ACTIVE AGENTS</text>
      <!-- Row 1 -->
      <circle class="s-dot"   cx="878" cy="154" r="4.5" fill="#38BDF8" filter="url(#glow1)"/>
      <text x="890" y="158" class="text-mono" font-size="9" fill="#CBD5E1">HERMES</text>
      <circle class="s-dot-b" cx="950" cy="154" r="4.5" fill="#10B981"/>
      <text x="962" y="158" class="text-mono" font-size="9" fill="#CBD5E1">FRONTEND</text>
      <circle class="s-dot-c" cx="1050" cy="154" r="4.5" fill="#A78BFA"/>
      <text x="1062" y="158" class="text-mono" font-size="9" fill="#CBD5E1">BACKEND</text>
      <!-- Row 2 -->
      <circle class="s-dot-d" cx="878" cy="172" r="4.5" fill="#FCD34D"/>
      <text x="890" y="176" class="text-mono" font-size="9" fill="#CBD5E1">QA / QC</text>
      <circle class="s-dot-e" cx="950" cy="172" r="4.5" fill="#F9A8D4"/>
      <text x="962" y="176" class="text-mono" font-size="9" fill="#CBD5E1">DEVOPS</text>
    </g>

    <line x1="868" y1="186" x2="1164" y2="186" stroke="#1E3A5F" stroke-width="1"/>

    <!-- Production systems -->
    <g class="mi3">
      <text x="868" y="202" class="text-mono" font-size="9" fill="#64748B" letter-spacing="1">PRODUCTION SYSTEMS</text>
      <text x="868" y="218" class="text-mono" font-size="9" fill="#38BDF8">▸ BERSEKA</text>
      <text x="940" y="218" class="text-mono" font-size="9" fill="#64748B">727 endpoints · 83 Prisma models</text>
      <text x="868" y="234" class="text-mono" font-size="9" fill="#10B981">▸ BITANIC</text>
      <text x="932" y="234" class="text-mono" font-size="9" fill="#64748B">IoT LMS · Laravel 12 · PostgreSQL 17</text>
      <text x="868" y="250" class="text-mono" font-size="9" fill="#A78BFA">▸ BOGOR TOLO</text>
      <text x="964" y="250" class="text-mono" font-size="9" fill="#64748B">Flutter · Laravel · SME Marketplace</text>
    </g>

    <!-- Floating particles -->
    <circle class="fp1" cx="820" cy="100" r="2.5" fill="#38BDF8" opacity=".5"/>
    <circle class="fp2" cx="828" cy="160" r="1.5" fill="#10B981" opacity=".4"/>
    <circle class="fp1" cx="814" cy="210" r="2" fill="#38BDF8" opacity=".35" style="animation-delay:2s"/>

    <!-- Bottom bar -->
    <rect x="0" y="273" width="1200" height="7" fill="url(#cyanG)" opacity=".5"/>
  </g>
</svg>
