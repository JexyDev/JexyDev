<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.4; } }
      @keyframes dashMove { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
      .live-pulse { animation: pulseGlow 2s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 8 6; animation: dashMove 1.5s linear infinite; }
    </style>

    <!-- Linear Gradients for Depth & Realism -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="50%" stop-color="#0B1322"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="emeraldAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Filters for 3D Lighting & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>

  <!-- Perspective 3D Grid Lines -->
  <g stroke="#1E3A5F" stroke-width="0.75" opacity="0.35">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <!-- Vertical Grid Lines -->
    <line x1="80" y1="0" x2="80" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="340" y1="0" x2="340" y2="280"/>
    <line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="620" y1="0" x2="620" y2="280"/>
    <line x1="740" y1="0" x2="740" y2="280"/>
  </g>

  <!-- Top Accent Light Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#cyanAccent)"/>

  <!-- ================= LEFT IDENTITY COMMAND REGION ================= -->
  <!-- Top Status Badge -->
  <g transform="translate(50, 32)">
    <rect width="320" height="26" rx="13" fill="#0B1528" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="16" cy="13" r="5" fill="#10B981" class="live-pulse" filter="url(#neonGlow)"/>
    <text x="30" y="17" class="mono" font-size="10.5" font-weight="700" fill="#10B981" letter-spacing="1">FULL-PERFORMANCE PRODUCTION ARCHITECT</text>
  </g>

  <!-- Location Badge -->
  <g transform="translate(385, 32)">
    <rect width="180" height="26" rx="13" fill="#0B1528" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#38BDF8"/>
    <text x="26" y="17" class="mono" font-size="10" fill="#94A3B8" letter-spacing="0.5">BOGOR · BANDUNG, ID</text>
  </g>

  <!-- Decorative Target Crosshair -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.4" transform="translate(50, 75)">
    <path d="M-8,-8 L-2,-8 M-8,-8 L-8,-2"/>
    <path d="M540,-8 L534,-8 M540,-8 L540,-2"/>
    <path d="M-8,140 L-2,140 M-8,140 L-8,134"/>
    <path d="M540,140 L534,140 M540,140 L540,134"/>
  </g>

  <!-- Candidate Name & Handle -->
  <g transform="translate(50, 96)">
    <text x="0" y="0" class="sans" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Jeremy Darrell Andreas</text>
    <rect x="420" y="-22" width="95" height="24" rx="4" fill="#0369A1" opacity="0.3"/>
    <text x="430" y="-6" class="mono" font-size="12" font-weight="700" fill="#38BDF8">@JexyDev</text>
  </g>

  <!-- Title & Executive Positioning -->
  <g transform="translate(50, 134)">
    <text x="0" y="0" class="sans" font-size="16" font-weight="600" fill="#38BDF8" letter-spacing="0.2">Fullstack Systems Engineer</text>
    <text x="224" y="0" class="sans" font-size="16" fill="#64748B"> · </text>
    <text x="245" y="0" class="sans" font-size="16" font-weight="600" fill="#F1F5F9" letter-spacing="0.2">Pragmatic Architect &amp; IoT Builder</text>
    <text x="0" y="24" class="sans" font-size="13" fill="#94A3B8">High-Velocity Engineering across Municipal Platforms, Distributed Backends &amp; Industrial Hardware</text>
  </g>

  <!-- Technology & Qualification Tags -->
  <g transform="translate(50, 192)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="100" height="26" rx="6" fill="#0C2038" stroke="#0284C7" stroke-width="1"/>
    <text x="50" y="17" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="middle">TYPESCRIPT</text>

    <!-- Tag 2 -->
    <rect x="110" y="0" width="95" height="26" rx="6" fill="#132B24" stroke="#059669" stroke-width="1"/>
    <text x="157" y="17" class="mono" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle">NODE / REST</text>

    <!-- Tag 3 -->
    <rect x="215" y="0" width="85" height="26" rx="6" fill="#1B1736" stroke="#7C3AED" stroke-width="1"/>
    <text x="257" y="17" class="mono" font-size="10.5" font-weight="700" fill="#A78BFA" text-anchor="middle">LARAVEL 12</text>

    <!-- Tag 4 -->
    <rect x="310" y="0" width="105" height="26" rx="6" fill="#2E1B10" stroke="#D97706" stroke-width="1"/>
    <text x="362" y="17" class="mono" font-size="10.5" font-weight="700" fill="#FBBF24" text-anchor="middle">POSTGRESQL</text>

    <!-- Tag 5 -->
    <rect x="425" y="0" width="80" height="26" rx="6" fill="#291223" stroke="#DB2777" stroke-width="1"/>
    <text x="465" y="17" class="mono" font-size="10.5" font-weight="700" fill="#F472B6" text-anchor="middle">FLUTTER</text>

    <!-- Tag 6 -->
    <rect x="515" y="0" width="90" height="26" rx="6" fill="#0A2540" stroke="#0284C7" stroke-width="1"/>
    <text x="560" y="17" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="middle">DOCKER CI</text>
  </g>

  <!-- Operational Focus Subline -->
  <g transform="translate(50, 248)">
    <text x="0" y="0" class="mono" font-size="11" fill="#64748B">CORE FOCUS :</text>
    <text x="95" y="0" class="mono" font-size="11" fill="#CBD5E1">Municipal Scale (berseka.id) │ Modbus RS485 IoT │ Strict ISO/IEC 25010 Standards</text>
  </g>

  <!-- ================= RIGHT 3D HUD TELEMETRY PANEL ================= -->
  <g transform="translate(685, 24)" filter="url(#cardShadow)">
    <!-- 3D Glassmorphic Panel Box -->
    <rect width="475" height="232" rx="10" fill="url(#panelGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>

    <!-- Panel Header Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 465 0 Q 475 0 475 10 L 475 38 L 0 38 Z" fill="#0B1322" opacity="0.9"/>
    <circle cx="20" cy="19" r="4" fill="#38BDF8" class="live-pulse"/>
    <text x="34" y="23" class="mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">VERIFIED ENGINEERING TELEMETRY</text>

    <!-- Live Badge -->
    <rect x="365" y="9" width="95" height="20" rx="4" fill="#042F2E" stroke="#14B8A6" stroke-width="0.8"/>
    <text x="412" y="23" class="mono" font-size="9.5" font-weight="700" fill="#2DD4BF" text-anchor="middle">LIVE VERIFIED</text>

    <line x1="0" y1="38" x2="475" y2="38" stroke="#1E293B" stroke-width="1"/>

    <!-- Row 1: High Velocity Commits -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="215" height="74" rx="6" fill="#0B1322" stroke="#1E3A5F" stroke-width="1"/>
      <text x="14" y="20" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.5">LIFECYCLE VELOCITY</text>
      <text x="14" y="46" class="mono" font-size="22" font-weight="800" fill="#38BDF8">3,700+</text>
      <text x="14" y="62" class="sans" font-size="10.5" fill="#64748B">Production Commits Total</text>
    </g>

    <!-- Row 2: Codebase Scale -->
    <g transform="translate(245, 52)">
      <rect x="0" y="0" width="210" height="74" rx="6" fill="#0B1322" stroke="#1E3A5F" stroke-width="1"/>
      <text x="14" y="20" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.5">CODEBASE VOLUME</text>
      <text x="14" y="46" class="mono" font-size="22" font-weight="800" fill="#10B981">302,189</text>
      <text x="14" y="62" class="sans" font-size="10.5" fill="#64748B">Lines of Verified TypeScript</text>
    </g>

    <!-- Row 3: BERSEKA Municipal Architecture -->
    <g transform="translate(20, 136)">
      <rect x="0" y="0" width="435" height="42" rx="6" fill="#0B1322" stroke="#1E3A5F" stroke-width="1"/>
      <circle cx="16" cy="21" r="3.5" fill="#10B981"/>
      <text x="28" y="18" class="mono" font-size="10" font-weight="700" fill="#F1F5F9">BERSEKA (berseka.id) :</text>
      <text x="180" y="18" class="mono" font-size="10" fill="#38BDF8">83 Prisma Models │ 659 API Endpoints</text>
      <text x="28" y="32" class="sans" font-size="9.5" fill="#94A3B8">Kota Bandung Municipal Waste Governance · 3,333 Main Commits</text>
    </g>

    <!-- Row 4: Hardware & IoT Telemetry -->
    <g transform="translate(20, 186)">
      <rect x="0" y="0" width="435" height="36" rx="6" fill="#0B1322" stroke="#1E3A5F" stroke-width="1"/>
      <circle cx="16" cy="18" r="3.5" fill="#38BDF8"/>
      <text x="28" y="17" class="mono" font-size="10" font-weight="700" fill="#F1F5F9">BITANIC LMS &amp; IOT :</text>
      <text x="160" y="17" class="mono" font-size="10" fill="#A78BFA">Modbus RS485 RTU │ CRC16 Validation</text>
      <text x="28" y="29" class="sans" font-size="9.5" fill="#94A3B8">4 Actuator Relays · 7-in-1 Soil Sensors · Collision-Free Lab Booking</text>
    </g>
  </g>

  <!-- Bottom Cyber Edge -->
  <rect x="0" y="276" width="1200" height="4" fill="url(#cyanAccent)"/>
</svg>
