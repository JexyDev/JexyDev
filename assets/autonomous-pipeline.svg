<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <style>
      .tm { font-family:'JetBrains Mono','Courier New',monospace; }
      .ts { font-family:'Inter','Segoe UI',Arial,sans-serif; }
      @keyframes gridF { 0%,100%{opacity:.06} 50%{opacity:.14} }
      @keyframes pulse2 { 0%,100%{opacity:1;r:6} 50%{opacity:.4;r:9} }
      @keyframes pulse3 { 0%,100%{opacity:.8} 50%{opacity:.2} }
      @keyframes orbit { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      @keyframes orbit2 { 0%{transform:rotate(360deg)} 100%{transform:rotate(0deg)} }
      @keyframes packetMove1 { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes packetMove2 { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes packetMove3 { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes packetMove4 { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes glow { 0%,100%{filter:drop-shadow(0 0 6px #38BDF8)} 50%{filter:drop-shadow(0 0 16px #38BDF8)} }
      @keyframes nodeGlow { 0%,100%{filter:drop-shadow(0 0 4px currentColor)} 50%{filter:drop-shadow(0 0 12px currentColor)} }
      @keyframes stageFlow { 0%{opacity:.3;transform:translateX(0)} 50%{opacity:1;transform:translateX(6px)} 100%{opacity:.3;transform:translateX(0)} }
      @keyframes fadeSlideIn { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes ringRotate { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      @keyframes ringRotate2 { 0%{transform:rotate(0deg)} 100%{transform:rotate(-360deg)} }
      .grid-h { animation:gridF 4s ease-in-out infinite; }
      .grid-v { animation:gridF 4s ease-in-out infinite 2s; }
      .h-core { animation:glow 2.5s ease-in-out infinite; }
      .r1 { transform-origin:600px 180px; animation:ringRotate 8s linear infinite; }
      .r2 { transform-origin:600px 180px; animation:ringRotate2 12s linear infinite; }
      .nd { animation:nodeGlow 3s ease-in-out infinite; }
      .pk1 { offset-path:path('M600,180 Q400,80 220,140'); animation:packetMove1 2.4s linear infinite; }
      .pk2 { offset-path:path('M600,180 Q500,60 320,100'); animation:packetMove1 2.4s linear infinite .6s; }
      .pk3 { offset-path:path('M600,180 Q700,60 880,100'); animation:packetMove2 2.4s linear infinite .3s; }
      .pk4 { offset-path:path('M600,180 Q800,80 980,140'); animation:packetMove2 2.4s linear infinite 1.2s; }
      .pk5 { offset-path:path('M600,180 Q500,300 320,260'); animation:packetMove3 2.4s linear infinite .9s; }
      .pk6 { offset-path:path('M600,180 Q500,300 220,220'); animation:packetMove3 2.4s linear infinite 1.8s; }
      .pk7 { offset-path:path('M600,180 Q700,300 880,260'); animation:packetMove4 2.4s linear infinite .4s; }
      .pk8 { offset-path:path('M600,180 Q700,300 980,220'); animation:packetMove4 2.4s linear infinite 1.4s; }
      .stage-arr { animation:stageFlow 1.6s ease-in-out infinite; }
      .stage-arr2 { animation:stageFlow 1.6s ease-in-out infinite .4s; }
      .stage-arr3 { animation:stageFlow 1.6s ease-in-out infinite .8s; }
      .stage-arr4 { animation:stageFlow 1.6s ease-in-out infinite 1.2s; }
      .fsi { animation:fadeSlideIn 1s ease forwards; opacity:0; }
      .fsi2 { animation:fadeSlideIn 1s ease forwards; animation-delay:.4s; opacity:0; }
      .fsi3 { animation:fadeSlideIn 1s ease forwards; animation-delay:.8s; opacity:0; }
      .fsi4 { animation:fadeSlideIn 1s ease forwards; animation-delay:1.2s; opacity:0; }
      .fsi5 { animation:fadeSlideIn 1s ease forwards; animation-delay:1.6s; opacity:0; }
    </style>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0B1120"/><stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cG2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="eG" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10B981"/><stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <!-- Node gradients -->
    <radialGradient id="hermesG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A5F"/><stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="feG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064E3B"/><stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="beG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1B69"/><stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="qaG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451A03"/><stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="dvG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#500724"/><stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="prodG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A5F"/><stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    <clipPath id="clip1"><rect width="1200" height="360"/></clipPath>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow3" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#38BDF8" opacity=".6"/>
    </marker>
    <marker id="arrowE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981" opacity=".6"/>
    </marker>
  </defs>

  <g clip-path="url(#clip1)">
    <!-- BG -->
    <rect width="1200" height="360" fill="url(#bg2)"/>

    <!-- Grid -->
    <g class="grid-h" stroke="#38BDF8" stroke-width=".5">
      <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    </g>
    <g class="grid-v" stroke="#38BDF8" stroke-width=".5">
      <line x1="100" y1="0" x2="100" y2="360"/><line x1="200" y1="0" x2="200" y2="360"/>
      <line x1="300" y1="0" x2="300" y2="360"/><line x1="400" y1="0" x2="400" y2="360"/>
      <line x1="500" y1="0" x2="500" y2="360"/><line x1="600" y1="0" x2="600" y2="360"/>
      <line x1="700" y1="0" x2="700" y2="360"/><line x1="800" y1="0" x2="800" y2="360"/>
      <line x1="900" y1="0" x2="900" y2="360"/><line x1="1000" y1="0" x2="1000" y2="360"/>
      <line x1="1100" y1="0" x2="1100" y2="360"/>
    </g>

    <!-- Left accent -->
    <rect x="0" y="0" width="4" height="360" fill="url(#cG2)"/>

    <!-- Top bar -->
    <rect x="0" y="0" width="1200" height="32" fill="#0F172A" opacity=".92"/>
    <text x="20" y="21" class="tm" font-size="10" fill="#38BDF8" letter-spacing="2">JEXYDEV // FULLSTACK ENGINEERING LIFECYCLE</text>
    <text x="700" y="21" class="tm" font-size="10" fill="#475569">DISCOVER → PLAN → IMPLEMENT → VERIFY → AUDIT → DEPLOY</text>

    <!-- Connection paths from Hermes to agents -->
    <!-- To Frontend (top-left) -->
    <path d="M600,180 Q400,80 220,140" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,4" opacity=".35" marker-end="url(#arrowE)"/>
    <!-- To Backend (top-right) -->
    <path d="M600,180 Q800,80 980,140" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6,4" opacity=".35"/>
    <!-- To QA/QC (bottom-left) -->
    <path d="M600,180 Q400,280 220,220" fill="none" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="6,4" opacity=".35"/>
    <!-- To DevOps (bottom-right) -->
    <path d="M600,180 Q800,280 980,220" fill="none" stroke="#F9A8D4" stroke-width="1.5" stroke-dasharray="6,4" opacity=".35"/>
    <!-- To Production (right) -->
    <path d="M600,180 Q780,180 920,290" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,4" opacity=".35" marker-end="url(#arrowC)"/>

    <!-- Animated data packets -->
    <circle class="pk1" r="4" fill="#10B981" opacity=".9" filter="url(#glow2)"/>
    <circle class="pk2" r="3" fill="#10B981" opacity=".7" filter="url(#glow2)"/>
    <circle class="pk3" r="4" fill="#A78BFA" opacity=".9" filter="url(#glow2)"/>
    <circle class="pk4" r="3" fill="#A78BFA" opacity=".7" filter="url(#glow2)"/>
    <circle class="pk5" r="4" fill="#FCD34D" opacity=".9" filter="url(#glow2)"/>
    <circle class="pk6" r="3" fill="#FCD34D" opacity=".7" filter="url(#glow2)"/>
    <circle class="pk7" r="4" fill="#F9A8D4" opacity=".9" filter="url(#glow2)"/>
    <circle class="pk8" r="3" fill="#F9A8D4" opacity=".7" filter="url(#glow2)"/>

    <!-- ===== HERMES CORE NODE ===== -->
    <g class="h-core fsi" transform="translate(600,180)">
      <!-- Outer glow ring -->
      <circle r="52" fill="none" stroke="#38BDF8" stroke-width="1" opacity=".2" filter="url(#glow3)"/>
      <!-- Rotating ring 1 -->
      <g class="r1">
        <circle cx="600" cy="180" r="46" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="8,16" opacity=".6"/>
      </g>
      <!-- Rotating ring 2 -->
      <g class="r2">
        <circle cx="600" cy="180" r="38" fill="none" stroke="#7DD3FC" stroke-width=".8" stroke-dasharray="4,20" opacity=".4"/>
      </g>
      <!-- Main body -->
      <circle r="32" fill="url(#hermesG)" stroke="#38BDF8" stroke-width="1.5"/>
      <!-- Inner glow -->
      <circle r="22" fill="none" stroke="#38BDF8" stroke-width=".5" opacity=".3"/>
      <!-- Label -->
      <text y="-6" class="tm" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">SYSTEMS</text>
      <text y="8" class="tm" font-size="8" fill="#94A3B8" text-anchor="middle">ARCHITECTURE</text>
      <text y="20" class="tm" font-size="7" fill="#64748B" text-anchor="middle">END-TO-END LEAD</text>
    </g>

    <!-- ===== FRONTEND AGENT (top-left) ===== -->
    <g class="nd fsi2" transform="translate(220,140)" color="#10B981">
      <circle r="38" fill="#064E3B" stroke="#10B981" stroke-width="1.5" opacity=".3" filter="url(#glow2)"/>
      <circle r="30" fill="url(#feG)" stroke="#10B981" stroke-width="1.5"/>
      <text y="-8" class="tm" font-size="9.5" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1">FRONTEND</text>
      <text y="6" class="tm" font-size="7" fill="#6EE7B7" text-anchor="middle">React · Next.js</text>
      <text y="17" class="tm" font-size="7" fill="#6EE7B7" text-anchor="middle">Flutter · TS</text>
    </g>
    <!-- Frontend label card -->
    <rect x="80" y="192" width="140" height="38" rx="3" fill="#162032" stroke="#10B981" stroke-width=".8" opacity=".9"/>
    <text x="150" y="208" class="tm" font-size="8" fill="#6EE7B7" text-anchor="middle">FRONTEND AGENT</text>
    <text x="150" y="220" class="tm" font-size="7" fill="#64748B" text-anchor="middle">Responsive UI · Cross-Platform</text>
    <text x="150" y="231" class="tm" font-size="7" fill="#64748B" text-anchor="middle">State Mgmt · Component Arch</text>

    <!-- ===== BACKEND AGENT (top-right) ===== -->
    <g class="nd fsi2" transform="translate(980,140)" color="#A78BFA">
      <circle r="38" fill="#2D1B69" stroke="#A78BFA" stroke-width="1.5" opacity=".3" filter="url(#glow2)"/>
      <circle r="30" fill="url(#beG)" stroke="#A78BFA" stroke-width="1.5"/>
      <text y="-8" class="tm" font-size="9.5" font-weight="700" fill="#A78BFA" text-anchor="middle" letter-spacing="1">BACKEND</text>
      <text y="6" class="tm" font-size="7" fill="#C4B5FD" text-anchor="middle">Laravel · Node.js</text>
      <text y="17" class="tm" font-size="7" fill="#C4B5FD" text-anchor="middle">Prisma · PostgreSQL</text>
    </g>
    <!-- Backend label card -->
    <rect x="980" y="192" width="140" height="38" rx="3" fill="#162032" stroke="#A78BFA" stroke-width=".8" opacity=".9"/>
    <text x="1050" y="208" class="tm" font-size="8" fill="#C4B5FD" text-anchor="middle">BACKEND AGENT</text>
    <text x="1050" y="220" class="tm" font-size="7" fill="#64748B" text-anchor="middle">REST · GraphQL · Auth</text>
    <text x="1050" y="231" class="tm" font-size="7" fill="#64748B" text-anchor="middle">DB Schema · Migrations</text>

    <!-- ===== QA/QC AGENT (bottom-left) ===== -->
    <g class="nd fsi3" transform="translate(220,220)" color="#FCD34D">
      <circle r="38" fill="#451A03" stroke="#FCD34D" stroke-width="1.5" opacity=".25" filter="url(#glow2)"/>
      <circle r="30" fill="url(#qaG)" stroke="#FCD34D" stroke-width="1.5"/>
      <text y="-8" class="tm" font-size="9.5" font-weight="700" fill="#FCD34D" text-anchor="middle" letter-spacing="1">QA / QC</text>
      <text y="6" class="tm" font-size="7" fill="#FDE68A" text-anchor="middle">Unit · Integration</text>
      <text y="17" class="tm" font-size="7" fill="#FDE68A" text-anchor="middle">Regression · Static</text>
    </g>
    <!-- QA label card -->
    <rect x="80" y="272" width="140" height="38" rx="3" fill="#162032" stroke="#FCD34D" stroke-width=".8" opacity=".9"/>
    <text x="150" y="288" class="tm" font-size="8" fill="#FDE68A" text-anchor="middle">QA / QC AGENT</text>
    <text x="150" y="300" class="tm" font-size="7" fill="#64748B" text-anchor="middle">Test Suites · Edge Cases</text>
    <text x="150" y="311" class="tm" font-size="7" fill="#64748B" text-anchor="middle">Merge Gate · Analysis</text>

    <!-- ===== DEVOPS AGENT (bottom-right) ===== -->
    <g class="nd fsi3" transform="translate(980,220)" color="#F9A8D4">
      <circle r="38" fill="#500724" stroke="#F9A8D4" stroke-width="1.5" opacity=".25" filter="url(#glow2)"/>
      <circle r="30" fill="url(#dvG)" stroke="#F9A8D4" stroke-width="1.5"/>
      <text y="-8" class="tm" font-size="9.5" font-weight="700" fill="#F9A8D4" text-anchor="middle" letter-spacing="1">DEVOPS</text>
      <text y="6" class="tm" font-size="7" fill="#FBCFE8" text-anchor="middle">Docker · CI/CD</text>
      <text y="17" class="tm" font-size="7" fill="#FBCFE8" text-anchor="middle">Docs · Pipelines</text>
    </g>
    <!-- DevOps label card -->
    <rect x="980" y="272" width="140" height="38" rx="3" fill="#162032" stroke="#F9A8D4" stroke-width=".8" opacity=".9"/>
    <text x="1050" y="288" class="tm" font-size="8" fill="#FBCFE8" text-anchor="middle">DEVOPS &amp; DOCS AGENT</text>
    <text x="1050" y="300" class="tm" font-size="7" fill="#64748B" text-anchor="middle">PRD · SRS · SDD · API Specs</text>
    <text x="1050" y="311" class="tm" font-size="7" fill="#64748B" text-anchor="middle">Docker · GitHub Actions</text>

    <!-- ===== PRODUCTION DELIVERY (bottom-center) ===== -->
    <g class="nd fsi4" transform="translate(600,308)">
      <circle r="28" fill="#1E3A5F" stroke="#38BDF8" stroke-width="2" opacity=".9" filter="url(#glow2)"/>
      <text y="-5" class="tm" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">PRODUCTION</text>
      <text y="8" class="tm" font-size="8" fill="#7DD3FC" text-anchor="middle">DELIVERY</text>
    </g>

    <!-- Pipeline stage flow indicator (bottom) -->
    <g class="fsi5">
      <rect x="100" y="338" width="1000" height="16" rx="2" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <!-- Stage labels with animated arrows -->
      <text x="145" y="350" class="tm" font-size="8" fill="#64748B" text-anchor="middle">DISCOVER</text>
      <text x="210" y="351" class="tm stage-arr" font-size="10" fill="#38BDF8" text-anchor="middle">→</text>
      <text x="265" y="350" class="tm" font-size="8" fill="#64748B" text-anchor="middle">PLAN</text>
      <text x="315" y="351" class="tm stage-arr2" font-size="10" fill="#38BDF8" text-anchor="middle">→</text>
      <text x="390" y="350" class="tm" font-size="8" fill="#64748B" text-anchor="middle">IMPLEMENT</text>
      <text x="455" y="351" class="tm stage-arr3" font-size="10" fill="#38BDF8" text-anchor="middle">→</text>
      <text x="510" y="350" class="tm" font-size="8" fill="#64748B" text-anchor="middle">VERIFY</text>
      <text x="560" y="351" class="tm stage-arr" font-size="10" fill="#38BDF8" text-anchor="middle">→</text>
      <text x="615" y="350" class="tm" font-size="8" fill="#64748B" text-anchor="middle">AUDIT</text>
      <text x="665" y="351" class="tm stage-arr2" font-size="10" fill="#38BDF8" text-anchor="middle">→</text>
      <text x="750" y="350" class="tm" font-size="8" fill="#10B981" font-weight="700" text-anchor="middle">DEPLOY</text>
      <text x="820" y="351" class="tm stage-arr3" font-size="10" fill="#10B981" text-anchor="middle">→</text>
      <text x="940" y="350" class="tm" font-size="8" fill="#38BDF8" font-weight="700" text-anchor="middle">PRODUCTION LIVE</text>
    </g>

    <!-- Bottom accent -->
    <rect x="0" y="354" width="1200" height="6" fill="url(#cG2)" opacity=".5"/>
  </g>
</svg>
